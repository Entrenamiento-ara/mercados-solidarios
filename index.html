<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mercados Solidarios</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    background:#ffffff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow-x:hidden;
}


/* =====================================================
   PIEZA
===================================================== */

.pieza-container{

    position:relative;

    width:100%;

    max-width:1200px;

    margin:0 auto;

    line-height:0;
}


.pieza{

    display:block;

    width:100%;

    height:auto;
}


/* =====================================================
   ÚNICO AJUSTE DE POSICIÓN
===================================================== */

/*
   CAMBIA SOLAMENTE ESTE VALOR.

   65% = más arriba
   70% = más abajo
   75% = todavía más abajo
   80% = cerca de la parte inferior

   IMPORTANTE:
   aquí estamos midiendo desde ARRIBA de la imagen.
*/

:root{

    --audio-top:68%;

}


/* =====================================================
   ZONA DEL REPRODUCTOR
===================================================== */

.audio-overlay{

    position:absolute;

    left:10%;

    width:80%;

    top:var(--audio-top);

    height:100px;

    display:flex;

    align-items:center;

    padding:10px 18px;

    background:rgba(255,255,255,0.96);

    border-radius:25px;

    box-shadow:

        0 8px 22px
        rgba(0,0,0,0.16);

    z-index:20;

}


/* =====================================================
   BOTÓN PLAY
===================================================== */

.play-btn{

    position:relative;

    width:72px;

    height:72px;

    min-width:72px;

    border:0;

    border-radius:50%;

    background:#5b951e;

    color:#ffffff;

    font-size:30px;

    line-height:1;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:0;

    box-shadow:

        0 7px 0 #3e6d15,

        0 12px 20px
        rgba(0,0,0,0.22),

        inset 0 2px 3px
        rgba(255,255,255,0.35);

    transition:

        transform .15s ease,

        box-shadow .15s ease;

}


/* =====================================================
   HOVER
===================================================== */

.play-btn:hover{

    transform:
        translateY(-3px)
        scale(1.03);

    box-shadow:

        0 10px 0 #3e6d15,

        0 17px 25px
        rgba(0,0,0,0.26),

        inset 0 2px 4px
        rgba(255,255,255,0.45);

}


/* =====================================================
   CLICK
===================================================== */

.play-btn:active{

    transform:
        translateY(4px)
        scale(.97);

    box-shadow:

        0 2px 0 #3e6d15,

        0 5px 10px
        rgba(0,0,0,0.18),

        inset 0 3px 5px
        rgba(0,0,0,0.12);

}


/* =====================================================
   PULSO MIENTRAS REPRODUCE
===================================================== */

.play-btn.playing{

    animation:
        audioPulse 1.6s
        infinite ease-in-out;

}


@keyframes audioPulse{

    0%{

        box-shadow:

            0 7px 0 #3e6d15,

            0 0 0 0
            rgba(91,149,30,.50),

            0 12px 20px
            rgba(0,0,0,.22),

            inset 0 2px 3px
            rgba(255,255,255,.35);

    }

    50%{

        box-shadow:

            0 7px 0 #3e6d15,

            0 0 0 15px
            rgba(91,149,30,.08),

            0 14px 23px
            rgba(0,0,0,.24),

            inset 0 2px 3px
            rgba(255,255,255,.35);

    }

    100%{

        box-shadow:

            0 7px 0 #3e6d15,

            0 0 0 0
            rgba(91,149,30,0),

            0 12px 20px
            rgba(0,0,0,.22),

            inset 0 2px 3px
            rgba(255,255,255,.35);

    }

}


/* =====================================================
   INFORMACIÓN
===================================================== */

.audio-info{

    flex:1;

    min-width:0;

    margin-left:20px;

    line-height:normal;

}


/* =====================================================
   TIEMPO
===================================================== */

.audio-time{

    font-size:14px;

    color:#444;

    margin-bottom:8px;

    line-height:1;

}


/* =====================================================
   BARRA
===================================================== */

.progress-container{

    position:relative;

    width:100%;

    height:10px;

    background:#dddddd;

    border-radius:20px;

    cursor:pointer;

    overflow:visible;

}


.progress-bar{

    position:absolute;

    left:0;

    top:0;

    width:0%;

    height:100%;

    background:#5b951e;

    border-radius:20px;

    transition:
        width .08s linear;

}


.progress-knob{

    position:absolute;

    left:0%;

    top:50%;

    width:18px;

    height:18px;

    border-radius:50%;

    background:#5b951e;

    transform:
        translate(-50%,-50%);

    box-shadow:

        0 3px 6px
        rgba(0,0,0,.25),

        inset 0 1px 2px
        rgba(255,255,255,.75);

    pointer-events:none;

}


/* =====================================================
   VOLUMEN
===================================================== */

.volume{

    margin-left:18px;

    font-size:22px;

    line-height:1;

    user-select:none;

}


/* =====================================================
   AUDIO
===================================================== */

#audio{

    display:none;

}


/* =====================================================
   CELULAR
===================================================== */

@media(max-width:700px){

    :root{

        --audio-top:70%;

    }


    .audio-overlay{

        left:6%;

        width:88%;

        height:75px;

        padding:8px 10px;

        border-radius:18px;

    }


    .play-btn{

        width:52px;

        height:52px;

        min-width:52px;

        font-size:22px;

    }


    .audio-info{

        margin-left:12px;

    }


    .audio-time{

        font-size:11px;

        margin-bottom:5px;

    }


    .progress-container{

        height:7px;

    }


    .progress-knob{

        width:13px;

        height:13px;

    }


    .volume{

        font-size:17px;

        margin-left:8px;

    }

}


/* =====================================================
   CELULAR PEQUEÑO
===================================================== */

@media(max-width:420px){

    .audio-overlay{

        left:5%;

        width:90%;

        height:65px;

        padding:6px 8px;

    }


    .play-btn{

        width:46px;

        height:46px;

        min-width:46px;

        font-size:19px;

    }


    .audio-info{

        margin-left:9px;

    }


    .audio-time{

        font-size:10px;

    }


    .volume{

        font-size:15px;

        margin-left:5px;

    }

}

</style>

</head>


<body>


<div class="pieza-container">


    <img
        src="Final_mercados.png"
        alt="Mercados Solidarios"
        class="pieza"
    >


    <div class="audio-overlay">


        <button
            id="playBtn"
            class="play-btn"
            type="button"
            aria-label="Reproducir audio"
        >

            ▶

        </button>


        <div class="audio-info">


            <div class="audio-time">

                <span id="currentTime">
                    00:00
                </span>

                <span>
                    /
                </span>

                <span id="duration">
                    00:00
                </span>

            </div>


            <div
                id="progressContainer"
                class="progress-container"
            >

                <div
                    id="progressBar"
                    class="progress-bar"
                ></div>


                <div
                    id="progressKnob"
                    class="progress-knob"
                ></div>

            </div>


        </div>


        <div class="volume">

            🔊

        </div>


    </div>


</div>


<audio
    id="audio"
    preload="metadata"
>

    <source
        src="Mercados_Solidarios.mp3"
        type="audio/mpeg"
    >

</audio>


<script>


/* =====================================================
   ELEMENTOS
===================================================== */

const audio =
    document.getElementById("audio");

const playBtn =
    document.getElementById("playBtn");

const progressContainer =
    document.getElementById("progressContainer");

const progressBar =
    document.getElementById("progressBar");

const progressKnob =
    document.getElementById("progressKnob");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");


/* =====================================================
   FORMATO TIEMPO
===================================================== */

function formatTime(seconds){

    if(
        !isFinite(seconds) ||
        seconds < 0
    ){

        return "00:00";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        Math.floor(
            seconds % 60
        );


    return (

        String(minutes)
            .padStart(2,"0")

        +

        ":"

        +

        String(secs)
            .padStart(2,"0")

    );

}


/* =====================================================
   DURACIÓN
===================================================== */

audio.addEventListener(
    "loadedmetadata",
    function(){

        duration.textContent =
            formatTime(
                audio.duration
            );

    }
);


/* =====================================================
   PLAY / PAUSA
===================================================== */

playBtn.addEventListener(
    "click",
    function(){

        if(audio.paused){

            audio.play();

        }else{

            audio.pause();

        }

    }
);


/* =====================================================
   REPRODUCIENDO
===================================================== */

audio.addEventListener(
    "play",
    function(){

        playBtn.innerHTML =
            "❚❚";

        playBtn.classList.add(
            "playing"
        );

    }
);


/* =====================================================
   PAUSADO
===================================================== */

audio.addEventListener(
    "pause",
    function(){

        playBtn.innerHTML =
            "▶";

        playBtn.classList.remove(
            "playing"
        );

    }
);


/* =====================================================
   ACTUALIZAR BARRA + TIEMPO
===================================================== */

audio.addEventListener(
    "timeupdate",
    function(){

        if(
            !isFinite(audio.duration) ||
            audio.duration <= 0
        ){

            return;

        }


        const percentage =

            (
                audio.currentTime /
                audio.duration
            ) * 100;


        progressBar.style.width =
            percentage + "%";


        progressKnob.style.left =
            percentage + "%";


        currentTime.textContent =
            formatTime(
                audio.currentTime
            );

    }
);


/* =====================================================
   CLICK EN LA BARRA
===================================================== */

progressContainer.addEventListener(
    "click",
    function(event){

        if(
            !isFinite(audio.duration)
        ){

            return;

        }


        const rect =
            progressContainer
                .getBoundingClientRect();


        const position =
            event.clientX -
            rect.left;


        let percentage =
            position /
            rect.width;


        percentage =
            Math.max(
                0,
                Math.min(
                    1,
                    percentage
                )
            );


        audio.currentTime =
            percentage *
            audio.duration;

    }
);


/* =====================================================
   CUANDO TERMINA
===================================================== */

audio.addEventListener(
    "ended",
    function(){

        playBtn.innerHTML =
            "▶";

        playBtn.classList.remove(
            "playing"
        );

        progressBar.style.width =
            "0%";

        progressKnob.style.left =
            "0%";

        currentTime.textContent =
            "00:00";

    }
);


/* =====================================================
   DURACIÓN
===================================================== */

audio.addEventListener(
    "durationchange",
    function(){

        if(
            isFinite(audio.duration)
        ){

            duration.textContent =
                formatTime(
                    audio.duration
                );

        }

    }
);

</script>

</body>
</html>
