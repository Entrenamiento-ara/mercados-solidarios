<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Campaña de solidaridad</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#ffffff;
    font-family:Arial, Helvetica, sans-serif;
}

.page{
    width:100%;
    display:flex;
    justify-content:center;
    padding:0;
}

.piece{
    position:relative;
    width:100%;
    max-width:1600px;
    line-height:0;
    overflow:hidden;
}

.piece img{
    display:block;
    width:100%;
    height:auto;
}

/* =========================================================
   CAPAS PARA OCULTAR LOS LOGOS
   ========================================================= */

/*
   Estas capas permiten ocultar visualmente los logos que
   están incluidos dentro de la imagen.

   Si alguno queda visible, solo modificamos estas posiciones.
*/

/* Logo Ara de la parte superior izquierda */
.hide-ara{
    position:absolute;
    left:0%;
    top:0%;
    width:22%;
    height:17%;
    background:#ffffff;
    z-index:5;
    pointer-events:none;
    display:none;
}

/* Logo Mercados Solidarios */
.hide-mercados{
    position:absolute;
    right:0%;
    top:0%;
    width:28%;
    height:19%;
    background:#ffffff;
    z-index:5;
    pointer-events:none;
    display:none;
}


/* =========================================================
   ZONA INTERACTIVA DEL AUDIO
   ========================================================= */

/*
   TODO el reproductor está encima de la imagen.

   No reemplaza la pieza.
   Solo coloca elementos transparentes/interactivos
   sobre el reproductor dibujado en la imagen.
*/

.audio-area{
    position:absolute;

    /*
      POSICIÓN VERTICAL DEL REPRODUCTOR

      Si necesitas mover TODO el reproductor:
      cambia únicamente este número.
    */
    top:52%;

    left:10%;
    width:80%;
    height:15%;

    z-index:10;
}


/* =========================================================
   BOTÓN PLAY
   ========================================================= */

.play-button{
    position:absolute;

    left:0%;
    top:8%;

    width:13%;
    aspect-ratio:1 / 1;

    border-radius:50%;

    border:0;

    cursor:pointer;

    background:rgba(255,255,255,0.04);

    /*
      Relieve
    */
    box-shadow:
        0 8px 14px rgba(0,0,0,0.22),
        inset 0 2px 3px rgba(255,255,255,0.70),
        inset 0 -3px 5px rgba(0,0,0,0.18);

    transition:
        transform .15s ease,
        box-shadow .15s ease,
        filter .15s ease;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:0;
}


/* Triángulo del Play */
.play-icon{
    width:0;
    height:0;

    border-top:18px solid transparent;
    border-bottom:18px solid transparent;
    border-left:29px solid #4c8f1f;

    margin-left:7px;

    filter:
        drop-shadow(0 2px 1px rgba(0,0,0,0.25));

    transition:all .2s ease;
}


/* Hover */
.play-button:hover{
    transform:translateY(-2px) scale(1.03);

    box-shadow:
        0 11px 18px rgba(0,0,0,0.26),
        inset 0 2px 4px rgba(255,255,255,0.80),
        inset 0 -3px 5px rgba(0,0,0,0.15);
}


/* Al presionar */
.play-button:active{
    transform:translateY(2px) scale(.97);

    box-shadow:
        0 3px 7px rgba(0,0,0,0.25),
        inset 0 3px 6px rgba(0,0,0,0.15);
}


/* =========================================================
   ANIMACIÓN CUANDO ESTÁ REPRODUCIENDO
   ========================================================= */

.play-button.playing{
    animation:audioPulse 1.8s infinite ease-in-out;
}

@keyframes audioPulse{

    0%{
        transform:scale(1);
        box-shadow:
            0 8px 14px rgba(0,0,0,0.22),
            0 0 0 0 rgba(76,143,31,0.45),
            inset 0 2px 3px rgba(255,255,255,0.70),
            inset 0 -3px 5px rgba(0,0,0,0.18);
    }

    50%{
        transform:scale(1.045);
        box-shadow:
            0 10px 17px rgba(0,0,0,0.24),
            0 0 0 12px rgba(76,143,31,0.10),
            inset 0 2px 3px rgba(255,255,255,0.70),
            inset 0 -3px 5px rgba(0,0,0,0.18);
    }

    100%{
        transform:scale(1);
        box-shadow:
            0 8px 14px rgba(0,0,0,0.22),
            0 0 0 0 rgba(76,143,31,0),
            inset 0 2px 3px rgba(255,255,255,0.70),
            inset 0 -3px 5px rgba(0,0,0,0.18);
    }
}


/* =========================================================
   BARRA DE PROGRESO
   ========================================================= */

.progress-zone{
    position:absolute;

    left:17%;
    top:28%;

    width:70%;
    height:25%;

    display:flex;
    align-items:center;
}


/* Barra base */
.progress-bar{
    position:relative;

    width:100%;
    height:14px;

    border-radius:20px;

    background:rgba(90,90,90,0.22);

    overflow:hidden;

    cursor:pointer;

    box-shadow:
        inset 0 2px 4px rgba(0,0,0,0.18),
        0 1px 1px rgba(255,255,255,0.6);
}


/* Parte que avanza */
.progress-fill{
    position:absolute;

    left:0;
    top:0;

    width:0%;

    height:100%;

    border-radius:20px;

    background:#5b951e;

    transition:width .08s linear;
}


/* Punto que se mueve */
.progress-knob{
    position:absolute;

    top:50%;

    left:0%;

    width:22px;
    height:22px;

    border-radius:50%;

    background:#5b951e;

    transform:translate(-50%,-50%);

    box-shadow:
        0 3px 6px rgba(0,0,0,0.25),
        inset 0 1px 2px rgba(255,255,255,0.7);

    pointer-events:none;
}


/* =========================================================
   TIEMPO
   ========================================================= */

.time-display{
    position:absolute;

    left:17%;
    top:60%;

    width:25%;

    font-size:clamp(14px,2vw,27px);

    line-height:1;

    color:#333333;

    white-space:nowrap;

    font-weight:500;

    pointer-events:none;
}

.current-time{
    color:#5b951e;
}


/* =========================================================
   AUDIO REAL
   ========================================================= */

#audio{
    display:none;
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:700px){

    .audio-area{
        top:52%;
        left:9%;
        width:82%;
        height:16%;
    }

    .play-button{
        width:15%;
        top:8%;
    }

    .play-icon{
        border-top-width:11px;
        border-bottom-width:11px;
        border-left-width:18px;
        margin-left:4px;
    }

    .progress-zone{
        left:17%;
        width:70%;
        top:29%;
    }

    .progress-bar{
        height:9px;
    }

    .progress-knob{
        width:16px;
        height:16px;
    }

    .time-display{
        left:17%;
        top:61%;
        font-size:14px;
    }
}

</style>
</head>


<body>

<div class="page">

    <div class="piece">

        <!-- IMAGEN PRINCIPAL -->
        <img
            src="Final_mercados.png"
            alt="Campaña de solidaridad"
        >


        <!--
        =====================================================
        CAPAS DE OCULTAMIENTO

        Las dejamos inicialmente DESACTIVADAS.

        Si al publicar todavía aparecen los logos,
        quitamos "display:none" de la capa correspondiente.
        =====================================================
        -->

        <div class="hide-ara"></div>

        <div class="hide-mercados"></div>


        <!-- AUDIO -->
        <div class="audio-area">

            <!-- BOTÓN -->
            <button
                id="playButton"
                class="play-button"
                aria-label="Reproducir mensaje"
                type="button"
            >
                <span
                    id="playIcon"
                    class="play-icon"
                ></span>
            </button>


            <!-- BARRA -->
            <div class="progress-zone">

                <div
                    id="progressBar"
                    class="progress-bar"
                    aria-label="Progreso del audio"
                >

                    <div
                        id="progressFill"
                        class="progress-fill"
                    ></div>

                    <div
                        id="progressKnob"
                        class="progress-knob"
                    ></div>

                </div>

            </div>


            <!-- TIEMPO -->
            <div class="time-display">

                <span
                    id="currentTime"
                    class="current-time"
                >00:00</span>

                <span> / </span>

                <span id="duration">
                    00:00
                </span>

            </div>

        </div>


        <!-- AUDIO -->
        <audio
            id="audio"
            preload="metadata"
        >
            <source
                src="Mercados_Solidarios.mp3"
                type="audio/mpeg"
            >

            Tu navegador no puede reproducir este audio.
        </audio>

    </div>

</div>


<script>

/* =========================================================
   ELEMENTOS
   ========================================================= */

const audio =
    document.getElementById("audio");

const playButton =
    document.getElementById("playButton");

const playIcon =
    document.getElementById("playIcon");

const progressBar =
    document.getElementById("progressBar");

const progressFill =
    document.getElementById("progressFill");

const progressKnob =
    document.getElementById("progressKnob");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");


/* =========================================================
   FORMATO DEL TIEMPO
   ========================================================= */

function formatTime(seconds){

    if(
        !isFinite(seconds) ||
        seconds < 0
    ){
        return "00:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60);

    return (
        String(minutes).padStart(2,"0")
        + ":" +
        String(secs).padStart(2,"0")
    );
}


/* =========================================================
   DURACIÓN
   ========================================================= */

audio.addEventListener(
    "loadedmetadata",
    function(){

        duration.textContent =
            formatTime(audio.duration);

    }
);


/* =========================================================
   PLAY / PAUSE
   ========================================================= */

playButton.addEventListener(
    "click",
    function(){

        if(audio.paused){

            audio.play()
                .then(function(){

                    playButton.classList.add(
                        "playing"
                    );

                    /*
                      Cambiamos visualmente
                      el triángulo a pausa.
                    */
                    playIcon.style.width = "10px";
                    playIcon.style.height = "28px";

                    playIcon.style.borderTop =
                        "0";

                    playIcon.style.borderBottom =
                        "0";

                    playIcon.style.borderLeft =
                        "7px solid #4c8f1f";

                    playIcon.style.borderRight =
                        "7px solid #4c8f1f";

                    playIcon.style.marginLeft =
                        "0";

                })
                .catch(function(error){

                    console.error(
                        "No se pudo reproducir:",
                        error
                    );

                });

        }else{

            audio.pause();

        }

    }
);


/* =========================================================
   EVENTO PLAY
   ========================================================= */

audio.addEventListener(
    "play",
    function(){

        playButton.classList.add(
            "playing"
        );

    }
);


/* =========================================================
   EVENTO PAUSE
   ========================================================= */

audio.addEventListener(
    "pause",
    function(){

        playButton.classList.remove(
            "playing"
        );

        /*
          Volvemos al triángulo.
        */

        playIcon.style.width = "0";
        playIcon.style.height = "0";

        playIcon.style.borderTop =
            "18px solid transparent";

        playIcon.style.borderBottom =
            "18px solid transparent";

        playIcon.style.borderLeft =
            "29px solid #4c8f1f";

        playIcon.style.borderRight =
            "0";

        playIcon.style.marginLeft =
            "7px";

    }
);


/* =========================================================
   ACTUALIZAR BARRA Y TIEMPO
   ========================================================= */

audio.addEventListener(
    "timeupdate",
    function(){

        if(!audio.duration){
            return;
        }

        const percentage =
            (audio.currentTime /
            audio.duration) * 100;


        /* Barra */
        progressFill.style.width =
            percentage + "%";


        /* Punto */
        progressKnob.style.left =
            percentage + "%";


        /* Tiempo */
        currentTime.textContent =
            formatTime(
                audio.currentTime
            );

    }
);


/* =========================================================
   CLIC SOBRE LA BARRA
   ========================================================= */

progressBar.addEventListener(
    "click",
    function(event){

        if(!audio.duration){
            return;
        }

        const rect =
            progressBar.getBoundingClientRect();

        const position =
            event.clientX -
            rect.left;

        const percentage =
            position /
            rect.width;

        audio.currentTime =
            percentage *
            audio.duration;

    }
);


/* =========================================================
   CUANDO TERMINA
   ========================================================= */

audio.addEventListener(
    "ended",
    function(){

        playButton.classList.remove(
            "playing"
        );

        progressFill.style.width =
            "0%";

        progressKnob.style.left =
            "0%";

        currentTime.textContent =
            "00:00";

    }
);

</script>

</body>
</html>
