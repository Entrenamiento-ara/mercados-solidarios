<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Mercados Solidarios</title>


<style>

/* =====================================================
   CONFIGURACIÓN GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #ffffff;
}

body {
    overflow-x: hidden;
}


/* =====================================================
   CONTENEDOR DE LA PIEZA
===================================================== */

.pieza-container {

    position: relative;

    width: 100%;

    max-width: 1200px;

    margin: 0 auto;

    line-height: 0;

}


/* =====================================================
   IMAGEN
===================================================== */

.pieza {

    display: block;

    width: 100%;

    height: auto;

    margin: 0;

    padding: 0;

}


/* =====================================================
   POSICIÓN DEL REPRODUCTOR
===================================================== */

/*
   REFERENCIA:
   "Mensaje Mercados Solidarios"

   Esta posición se mantiene proporcional
   tanto en computador como en celular.

   76% = posición actual de referencia.

   Si posteriormente necesitamos un pequeño ajuste,
   solamente modificaremos este número.
*/

:root {

    --audio-top: 76%;

}


/* =====================================================
   REPRODUCTOR
===================================================== */

.audio-overlay {

    position: absolute;

    /*
       ANCLADO A LA IMAGEN
    */

    top: var(--audio-top);

    left: 10%;

    width: 80%;


    /*
       ALTURA DEL REPRODUCTOR
    */

    height: 6%;

    min-height: 58px;

    max-height: 82px;


    display: flex;

    align-items: center;


    /*
       FONDO BLANCO SÓLIDO
       NO TRANSPARENTE
    */

    background: #ffffff;


    padding: 6px 14px;


    border-radius: 18px;


    box-shadow:

        0 5px 14px
        rgba(0,0,0,0.13);


    z-index: 50;

}


/* =====================================================
   BOTÓN PLAY
===================================================== */

.play-btn {

    position: relative;

    width: 58px;

    height: 58px;

    min-width: 58px;


    border: none;

    border-radius: 50%;


    background: #5b951e;

    color: #ffffff;


    font-size: 25px;

    line-height: 1;


    padding: 0;


    cursor: pointer;


    display: flex;

    align-items: center;

    justify-content: center;


    /*
       RELIEVE 3D
    */

    box-shadow:

        0 5px 0 #3f6f16,

        0 9px 16px
        rgba(0,0,0,0.22),

        inset 0 2px 3px
        rgba(255,255,255,0.35);


    transition:

        transform 0.15s ease,

        box-shadow 0.15s ease;

}


/* =====================================================
   EFECTO HOVER
===================================================== */

.play-btn:hover {

    transform:

        translateY(-3px)
        scale(1.03);


    box-shadow:

        0 8px 0 #3f6f16,

        0 13px 20px
        rgba(0,0,0,0.25),

        inset 0 2px 4px
        rgba(255,255,255,0.45);

}


/* =====================================================
   EFECTO AL PRESIONAR
===================================================== */

.play-btn:active {

    transform:

        translateY(4px)
        scale(0.97);


    box-shadow:

        0 2px 0 #3f6f16,

        0 5px 9px
        rgba(0,0,0,0.18),

        inset 0 3px 5px
        rgba(0,0,0,0.12);

}


/* =====================================================
   PULSO MIENTRAS SE REPRODUCE
===================================================== */

.play-btn.playing {

    animation:

        audioPulse
        1.6s
        infinite
        ease-in-out;

}


@keyframes audioPulse {

    0% {

        box-shadow:

            0 5px 0 #3f6f16,

            0 0 0 0
            rgba(91,149,30,0.50),

            0 9px 16px
            rgba(0,0,0,0.22),

            inset 0 2px 3px
            rgba(255,255,255,0.35);

    }


    50% {

        box-shadow:

            0 5px 0 #3f6f16,

            0 0 0 13px
            rgba(91,149,30,0.08),

            0 11px 19px
            rgba(0,0,0,0.24),

            inset 0 2px 3px
            rgba(255,255,255,0.35);

    }


    100% {

        box-shadow:

            0 5px 0 #3f6f16,

            0 0 0 0
            rgba(91,149,30,0),

            0 9px 16px
            rgba(0,0,0,0.22),

            inset 0 2px 3px
            rgba(255,255,255,0.35);

    }

}


/* =====================================================
   INFORMACIÓN DEL AUDIO
===================================================== */

.audio-info {

    flex: 1;

    min-width: 0;

    margin-left: 16px;

    line-height: normal;

}


/* =====================================================
   TIEMPO
===================================================== */

.audio-time {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 12px;

    color: #444444;

    margin-bottom: 5px;

    line-height: 1;

}


/* =====================================================
   BARRA DE PROGRESO
===================================================== */

.progress-container {

    position: relative;

    width: 100%;

    height: 8px;

    background: #dedede;

    border-radius: 20px;

    cursor: pointer;

    overflow: visible;

}


/* =====================================================
   BARRA VERDE
===================================================== */

.progress-bar {

    position: absolute;

    left: 0;

    top: 0;

    width: 0%;

    height: 100%;

    background: #5b951e;

    border-radius: 20px;

    transition:

        width 0.08s linear;

}


/* =====================================================
   PUNTO DE AVANCE
===================================================== */

.progress-knob {

    position: absolute;

    left: 0%;

    top: 50%;

    width: 15px;

    height: 15px;

    border-radius: 50%;

    background: #5b951e;

    transform:
        translate(-50%, -50%);


    box-shadow:

        0 2px 5px
        rgba(0,0,0,0.25),

        inset 0 1px 2px
        rgba(255,255,255,0.75);


    pointer-events: none;

}


/* =====================================================
   ICONO DE VOLUMEN
===================================================== */

.volume {

    margin-left: 14px;

    font-size: 19px;

    line-height: 1;

    user-select: none;

}


/* =====================================================
   AUDIO
===================================================== */

#audio {

    display: none;

}


/* =====================================================
   CELULAR
===================================================== */

/*
   IMPORTANTE:

   NO cambiamos la posición vertical.

   Se conserva el mismo --audio-top,
   porque el reproductor está dentro
   del contenedor de la imagen.
*/

@media (max-width: 700px) {


    .audio-overlay {

        left: 7%;

        width: 86%;

        top: var(--audio-top);


        height: 6%;

        min-height: 48px;

        max-height: 62px;


        padding:

            5px 9px;


        border-radius: 14px;

    }


    .play-btn {

        width: 44px;

        height: 44px;

        min-width: 44px;

        font-size: 19px;


        box-shadow:

            0 4px 0 #3f6f16,

            0 7px 12px
            rgba(0,0,0,0.20),

            inset 0 2px 3px
            rgba(255,255,255,0.35);

    }


    .audio-info {

        margin-left: 10px;

    }


    .audio-time {

        font-size: 9px;

        margin-bottom: 4px;

    }


    .progress-container {

        height: 6px;

    }


    .progress-knob {

        width: 11px;

        height: 11px;

    }


    .volume {

        font-size: 15px;

        margin-left: 7px;

    }

}


/* =====================================================
   CELULAR PEQUEÑO
===================================================== */

@media (max-width: 420px) {


    .audio-overlay {

        left: 6%;

        width: 88%;

        top: var(--audio-top);


        height: 6%;

        min-height: 43px;


        padding:

            4px 7px;

    }


    .play-btn {

        width: 39px;

        height: 39px;

        min-width: 39px;

        font-size: 17px;

    }


    .audio-info {

        margin-left: 8px;

    }


    .audio-time {

        font-size: 8px;

        margin-bottom: 3px;

    }


    .progress-container {

        height: 5px;

    }


    .progress-knob {

        width: 10px;

        height: 10px;

    }


    .volume {

        font-size: 13px;

        margin-left: 5px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     PIEZA
===================================================== -->

<div class="pieza-container">


    <img
        src="Final_mercados.png"
        alt="Mercados Solidarios"
        class="pieza"
    >


    <!-- =================================================
         REPRODUCTOR
    ================================================= -->

    <div class="audio-overlay">


        <!-- BOTÓN PLAY -->

        <button
            id="playBtn"
            class="play-btn"
            type="button"
            aria-label="Reproducir audio"
        >

            ▶

        </button>


        <!-- INFORMACIÓN -->

        <div class="audio-info">


            <!-- TIEMPO -->

            <div class="audio-time">

                <span id="currentTime">
                    00:00
                </span>

                <span>
                    /
                </span>

                <span id="duration">
                    00:00
                </span>

            </div>


            <!-- BARRA -->

            <div
                id="progressContainer"
                class="progress-container"
            >

                <div
                    id="progressBar"
                    class="progress-bar"
                ></div>


                <div
                    id="progressKnob"
                    class="progress-knob"
                ></div>

            </div>


        </div>


        <!-- VOLUMEN -->

        <div class="volume">
            🔊
        </div>


    </div>

</div>


<!-- =====================================================
     AUDIO REAL
===================================================== -->

<audio
    id="audio"
    preload="metadata"
>

    <source
        src="Mercados_Solidarios.mp3"
        type="audio/mpeg"
    >

</audio>


<script>


/* =====================================================
   ELEMENTOS
===================================================== */

const audio =
    document.getElementById(
        "audio"
    );


const playBtn =
    document.getElementById(
        "playBtn"
    );


const progressContainer =
    document.getElementById(
        "progressContainer"
    );


const progressBar =
    document.getElementById(
        "progressBar"
    );


const progressKnob =
    document.getElementById(
        "progressKnob"
    );


const currentTime =
    document.getElementById(
        "currentTime"
    );


const duration =
    document.getElementById(
        "duration"
    );


/* =====================================================
   FORMATO DEL TIEMPO
===================================================== */

function formatTime(seconds) {

    if (
        !isFinite(seconds) ||
        seconds < 0
    ) {

        return "00:00";

    }


    const minutes =

        Math.floor(
            seconds / 60
        );


    const secs =

        Math.floor(
            seconds % 60
        );


    return (

        String(minutes)
            .padStart(2, "0")

        +

        ":"

        +

        String(secs)
            .padStart(2, "0")

    );

}


/* =====================================================
   CARGAR DURACIÓN
===================================================== */

audio.addEventListener(
    "loadedmetadata",
    function() {

        if (
            isFinite(
                audio.duration
            )
        ) {

            duration.textContent =

                formatTime(
                    audio.duration
                );

        }

    }
);


/* =====================================================
   PLAY / PAUSA
===================================================== */

playBtn.addEventListener(
    "click",
    function() {

        if (
            audio.paused
        ) {

            audio.play()
                .catch(
                    function(error) {

                        console.error(
                            "Error reproduciendo audio:",
                            error
                        );

                    }
                );

        } else {

            audio.pause();

        }

    }
);


/* =====================================================
   REPRODUCIENDO
===================================================== */

audio.addEventListener(
    "play",
    function() {

        playBtn.innerHTML =
            "❚❚";

        playBtn.classList.add(
            "playing"
        );

    }
);


/* =====================================================
   PAUSADO
===================================================== */

audio.addEventListener(
    "pause",
    function() {

        playBtn.innerHTML =
            "▶";

        playBtn.classList.remove(
            "playing"
        );

    }
);


/* =====================================================
   ACTUALIZAR BARRA Y TIEMPO
===================================================== */

audio.addEventListener(
    "timeupdate",
    function() {

        if (
            !isFinite(
                audio.duration
            ) ||
            audio.duration <= 0
        ) {

            return;

        }


        const percentage =

            (
                audio.currentTime /
                audio.duration
            ) * 100;


        progressBar.style.width =

            percentage + "%";


        progressKnob.style.left =

            percentage + "%";


        currentTime.textContent =

            formatTime(
                audio.currentTime
            );

    }
);


/* =====================================================
   CLIC EN LA BARRA
===================================================== */

progressContainer.addEventListener(
    "click",
    function(event) {

        if (
            !isFinite(
                audio.duration
            )
        ) {

            return;

        }


        const rect =

            progressContainer
                .getBoundingClientRect();


        const position =

            event.clientX -
            rect.left;


        let percentage =

            position /
            rect.width;


        percentage =

            Math.max(
                0,
                Math.min(
                    1,
                    percentage
                )
            );


        audio.currentTime =

            percentage *
            audio.duration;

    }
);


/* =====================================================
   SOPORTE PARA TOQUE EN CELULAR
===================================================== */

progressContainer.addEventListener(
    "touchstart",
    function(event) {

        if (
            !isFinite(
                audio.duration
            )
        ) {

            return;

        }


        const touch =
            event.touches[0];


        const rect =

            progressContainer
                .getBoundingClientRect();


        const position =

            touch.clientX -
            rect.left;


        let percentage =

            position /
            rect.width;


        percentage =

            Math.max(
                0,
                Math.min(
                    1,
                    percentage
                )
            );


        audio.currentTime =

            percentage *
            audio.duration;

    },
    {
        passive: true
    }
);


/* =====================================================
   CUANDO TERMINA EL AUDIO
===================================================== */

audio.addEventListener(
    "ended",
    function() {

        playBtn.innerHTML =
            "▶";

        playBtn.classList.remove(
            "playing"
        );

        progressBar.style.width =
            "0%";

        progressKnob.style.left =
            "0%";

        currentTime.textContent =
            "00:00";

    }
);


/* =====================================================
   ACTUALIZAR DURACIÓN
===================================================== */

audio.addEventListener(
    "durationchange",
    function() {

        if (
            isFinite(
                audio.duration
            )
        ) {

            duration.textContent =

                formatTime(
                    audio.duration
                );

        }

    }
);

</script>


</body>

</html>
