<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Mercados Solidarios</title>


<style>

/* =========================================================
   CONFIGURACIÓN GENERAL
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;

    background: #ffffff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body {
    overflow-x: hidden;
}


/* =========================================================
   CONTENEDOR DE LA PIEZA
========================================================= */

.pieza-container {

    position: relative;

    width: 100%;

    max-width: 1200px;

    margin: 0 auto;

    line-height: 0;
}


/* =========================================================
   IMAGEN
========================================================= */

.pieza {

    display: block;

    width: 100%;

    height: auto;

    margin: 0;

    padding: 0;
}


/* =========================================================
   REPRODUCTOR
========================================================= */

.audio-overlay {

    position: absolute;

    /*
       IMPORTANTE:

       El reproductor está colocado desde ABAJO
       para que no tape la frase superior.

       Si necesitas moverlo:

       bottom: 10%  -> más abajo

       bottom: 14%  -> más arriba
    */

    left: 10%;

    right: 10%;

    bottom: 10%;

    height: 12%;

    min-height: 90px;

    display: flex;

    align-items: center;

    padding: 10px 18px;

    background: rgba(255,255,255,0.96);

    border-radius: 25px;

    box-shadow:

        0 7px 20px
        rgba(0,0,0,0.14);

    z-index: 20;
}


/* =========================================================
   BOTÓN PLAY
========================================================= */

.play-btn {

    position: relative;

    width: 72px;

    height: 72px;

    min-width: 72px;

    border: none;

    border-radius: 50%;

    background: #5b951e;

    color: white;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 30px;

    line-height: 1;

    padding: 0;

    box-shadow:

        0 6px 0 #3f6f16,

        0 10px 18px
        rgba(0,0,0,0.22);

    transition:

        transform 0.15s ease,

        box-shadow 0.15s ease;
}


/* =========================================================
   EFECTO HOVER
========================================================= */

.play-btn:hover {

    transform:
        translateY(-3px);

    box-shadow:

        0 9px 0 #3f6f16,

        0 14px 22px
        rgba(0,0,0,0.25);
}


/* =========================================================
   EFECTO AL PRESIONAR
========================================================= */

.play-btn:active {

    transform:
        translateY(4px);

    box-shadow:

        0 2px 0 #3f6f16,

        0 5px 10px
        rgba(0,0,0,0.18);
}


/* =========================================================
   EFECTO MIENTRAS REPRODUCE
========================================================= */

.play-btn.playing {

    animation:
        audioPulse 1.6s
        infinite ease-in-out;
}


@keyframes audioPulse {

    0% {

        box-shadow:

            0 6px 0 #3f6f16,

            0 0 0 0
            rgba(91,149,30,0.50);

    }

    50% {

        box-shadow:

            0 6px 0 #3f6f16,

            0 0 0 14px
            rgba(91,149,30,0.10);

    }

    100% {

        box-shadow:

            0 6px 0 #3f6f16,

            0 0 0 0
            rgba(91,149,30,0);

    }
}


/* =========================================================
   CONTENEDOR INFORMACIÓN
========================================================= */

.audio-info {

    flex: 1;

    min-width: 0;

    margin-left: 20px;

    line-height: normal;
}


/* =========================================================
   TITULO
========================================================= */

.audio-title {

    display: none;
}


/* =========================================================
   TIEMPO
========================================================= */

.audio-time {

    font-size: 14px;

    color: #444444;

    margin-bottom: 7px;

    line-height: 1;
}


/* =========================================================
   BARRA
========================================================= */

.progress-container {

    position: relative;

    width: 100%;

    height: 10px;

    background: #dedede;

    border-radius: 20px;

    overflow: visible;

    cursor: pointer;
}


/* =========================================================
   BARRA VERDE
========================================================= */

.progress-bar {

    position: absolute;

    left: 0;

    top: 0;

    width: 0%;

    height: 100%;

    background: #5b951e;

    border-radius: 20px;

    transition:
        width 0.08s linear;
}


/* =========================================================
   PUNTO DE AVANCE
========================================================= */

.progress-knob {

    position: absolute;

    left: 0%;

    top: 50%;

    width: 18px;

    height: 18px;

    border-radius: 50%;

    background: #5b951e;

    transform:
        translate(-50%,-50%);

    box-shadow:

        0 3px 6px
        rgba(0,0,0,0.25),

        inset 0 1px 2px
        rgba(255,255,255,0.75);

    pointer-events: none;
}


/* =========================================================
   VOLUMEN
========================================================= */

.volume {

    margin-left: 18px;

    font-size: 22px;

    line-height: 1;

    user-select: none;
}


/* =========================================================
   AUDIO REAL
========================================================= */

#audio {

    display: none;
}


/* =========================================================
   CELULAR
========================================================= */

@media (max-width: 700px) {


    .audio-overlay {

        left: 7%;

        right: 7%;

        bottom: 8%;

        height: 13%;

        min-height: 72px;

        padding:
            8px 10px;

        border-radius: 18px;
    }


    .play-btn {

        width: 52px;

        height: 52px;

        min-width: 52px;

        font-size: 22px;

        box-shadow:

            0 4px 0 #3f6f16,

            0 7px 12px
            rgba(0,0,0,0.20);
    }


    .audio-info {

        margin-left: 12px;
    }


    .audio-time {

        font-size: 11px;

        margin-bottom: 5px;
    }


    .progress-container {

        height: 7px;
    }


    .progress-knob {

        width: 13px;

        height: 13px;
    }


    .volume {

        font-size: 17px;

        margin-left: 8px;
    }

}


/* =========================================================
   CELULAR PEQUEÑO
========================================================= */

@media (max-width: 420px) {


    .audio-overlay {

        left: 5%;

        right: 5%;

        bottom: 7%;

        min-height: 64px;

        padding: 6px 8px;
    }


    .play-btn {

        width: 46px;

        height: 46px;

        min-width: 46px;

        font-size: 19px;
    }


    .audio-info {

        margin-left: 9px;
    }


    .audio-time {

        font-size: 10px;
    }


    .volume {

        font-size: 15px;

        margin-left: 5px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     PIEZA
===================================================== -->

<div class="pieza-container">


    <!-- IMAGEN -->

    <img
        src="Final_mercados.png"
        alt="Mercados Solidarios"
        class="pieza"
    >


    <!-- =================================================
         REPRODUCTOR
    ================================================= -->

    <div class="audio-overlay">


        <!-- BOTÓN -->

        <button
            id="playBtn"
            class="play-btn"
            type="button"
            aria-label="Reproducir audio"
        >

            ▶

        </button>


        <!-- INFORMACIÓN -->

        <div class="audio-info">


            <!-- TIEMPO -->

            <div class="audio-time">

                <span id="currentTime">
                    00:00
                </span>

                <span>
                    /
                </span>

                <span id="duration">
                    00:00
                </span>

            </div>


            <!-- BARRA -->

            <div
                id="progressContainer"
                class="progress-container"
            >

                <div
                    id="progressBar"
                    class="progress-bar"
                ></div>


                <div
                    id="progressKnob"
                    class="progress-knob"
                ></div>

            </div>


        </div>


        <!-- VOLUMEN -->

        <div class="volume">

            🔊

        </div>


    </div>


</div>


<!-- =====================================================
     AUDIO
===================================================== -->

<audio
    id="audio"
    preload="metadata"
>

    <source
        src="Mercados_Solidarios.mp3"
        type="audio/mpeg"
    >

</audio>



<script>


/* =====================================================
   ELEMENTOS
===================================================== */

const audio =
    document.getElementById(
        "audio"
    );


const playBtn =
    document.getElementById(
        "playBtn"
    );


const progressContainer =
    document.getElementById(
        "progressContainer"
    );


const progressBar =
    document.getElementById(
        "progressBar"
    );


const progressKnob =
    document.getElementById(
        "progressKnob"
    );


const currentTime =
    document.getElementById(
        "currentTime"
    );


const duration =
    document.getElementById(
        "duration"
    );



/* =====================================================
   FORMATO TIEMPO
===================================================== */

function formatTime(
    seconds
) {


    if (
        !isFinite(seconds)
        ||
        seconds < 0
    ) {

        return "00:00";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        Math.floor(
            seconds % 60
        );


    return (

        String(minutes)
            .padStart(2,"0")

        +

        ":"

        +

        String(secs)
            .padStart(2,"0")

    );

}



/* =====================================================
   CARGAR DURACIÓN
===================================================== */

audio.addEventListener(
    "loadedmetadata",
    function() {


        if (
            isFinite(
                audio.duration
            )
        ) {

            duration.textContent =
                formatTime(
                    audio.duration
                );

        }

    }
);



/* =====================================================
   PLAY / PAUSA
===================================================== */

playBtn.addEventListener(
    "click",
    function() {


        if (
            audio.paused
        ) {


            audio.play()
                .catch(
                    function(error) {

                        console.error(
                            error
                        );

                    }
                );


        }

        else {


            audio.pause();

        }

    }
);



/* =====================================================
   CUANDO EMPIEZA
===================================================== */

audio.addEventListener(
    "play",
    function() {


        playBtn.innerHTML =
            "❚❚";


        playBtn.classList.add(
            "playing"
        );

    }
);



/* =====================================================
   CUANDO PAUSA
===================================================== */

audio.addEventListener(
    "pause",
    function() {


        playBtn.innerHTML =
            "▶";


        playBtn.classList.remove(
            "playing"
        );

    }
);



/* =====================================================
   ACTUALIZAR PROGRESO
===================================================== */

audio.addEventListener(
    "timeupdate",
    function() {


        if (
            !isFinite(
                audio.duration
            )
            ||
            audio.duration <= 0
        ) {

            return;

        }


        const percentage =

            (
                audio.currentTime
                /
                audio.duration
            )
            *
            100;


        /* BARRA */

        progressBar.style.width =
            percentage + "%";


        /* PUNTO */

        progressKnob.style.left =
            percentage + "%";


        /* TIEMPO */

        currentTime.textContent =
            formatTime(
                audio.currentTime
            );

    }
);



/* =====================================================
   CLICK EN BARRA
===================================================== */

progressContainer.addEventListener(
    "click",
    function(event) {


        if (
            !isFinite(
                audio.duration
            )
        ) {

            return;

        }


        const rect =
            progressContainer
                .getBoundingClientRect();


        const position =
            event.clientX
            -
            rect.left;


        let percentage =
            position
            /
            rect.width;


        percentage =
            Math.max(
                0,
                Math.min(
                    1,
                    percentage
                )
            );


        audio.currentTime =
            percentage
            *
            audio.duration;

    }
);



/* =====================================================
   TOQUE EN CELULAR
===================================================== */

progressContainer.addEventListener(
    "touchstart",
    function(event) {


        if (
            !isFinite(
                audio.duration
            )
        ) {

            return;

        }


        const touch =
            event.touches[0];


        const rect =
            progressContainer
                .getBoundingClientRect();


        const position =
            touch.clientX
            -
            rect.left;


        let percentage =
            position
            /
            rect.width;


        percentage =
            Math.max(
                0,
                Math.min(
                    1,
                    percentage
                )
            );


        audio.currentTime =
            percentage
            *
            audio.duration;


    },
    {
        passive: true
    }
);



/* =====================================================
   CUANDO TERMINA
===================================================== */

audio.addEventListener(
    "ended",
    function() {


        playBtn.innerHTML =
            "▶";


        playBtn.classList.remove(
            "playing"
        );


        progressBar.style.width =
            "0%";


        progressKnob.style.left =
            "0%";


        currentTime.textContent =
            "00:00";

    }
);



/* =====================================================
   DURACIÓN ACTUALIZADA
===================================================== */

audio.addEventListener(
    "durationchange",
    function() {


        if (
            isFinite(
                audio.duration
            )
        ) {


            duration.textContent =
                formatTime(
                    audio.duration
                );

        }

    }
);


</script>


</body>

</html>
