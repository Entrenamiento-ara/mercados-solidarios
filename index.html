<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mercados Solidarios</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    overflow-x: hidden;
}

/* =====================================================
   PIEZA PRINCIPAL
===================================================== */

.pieza-container {
    position: relative;
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
}

.pieza {
    display: block;
    width: 100%;
    height: auto;
}


/* =====================================================
   REPRODUCTOR
===================================================== */

.audio-overlay {
    position: absolute;

    /*
      EL REPRODUCTOR QUEDA EN LA PARTE INFERIOR
      DE LA IMAGEN.

      bottom: 0%
      = pegado al borde inferior.

      NO utilizamos top.
    */

    left: 8%;
    width: 84%;

    bottom: 0%;

    height: 12%;

    min-height: 85px;

    display: flex;
    align-items: center;

    padding: 10px 18px;

    background: rgba(255,255,255,0.96);

    border-radius: 24px 24px 0 0;

    box-shadow:
        0 -5px 18px rgba(0,0,0,0.12);

    z-index: 20;
}


/* =====================================================
   BOTÓN PLAY
===================================================== */

.play-btn {
    width: 72px;
    height: 72px;
    min-width: 72px;

    border: none;
    border-radius: 50%;

    background: #5b951e;

    color: #ffffff;

    font-size: 30px;
    line-height: 1;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 0;

    cursor: pointer;

    box-shadow:
        0 6px 0 #3f6f16,
        0 10px 18px rgba(0,0,0,0.22);

    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
}


/* Hover */

.play-btn:hover {
    transform: translateY(-3px);

    box-shadow:
        0 9px 0 #3f6f16,
        0 14px 22px rgba(0,0,0,0.25);
}


/* Presionar */

.play-btn:active {
    transform: translateY(4px);

    box-shadow:
        0 2px 0 #3f6f16,
        0 5px 10px rgba(0,0,0,0.18);
}


/* =====================================================
   ANIMACIÓN MIENTRAS REPRODUCE
===================================================== */

.play-btn.playing {
    animation: pulseAudio 1.6s infinite ease-in-out;
}

@keyframes pulseAudio {

    0% {
        box-shadow:
            0 6px 0 #3f6f16,
            0 0 0 0 rgba(91,149,30,0.45);
    }

    50% {
        box-shadow:
            0 6px 0 #3f6f16,
            0 0 0 15px rgba(91,149,30,0.10);
    }

    100% {
        box-shadow:
            0 6px 0 #3f6f16,
            0 0 0 0 rgba(91,149,30,0);
    }
}


/* =====================================================
   INFORMACIÓN DEL AUDIO
===================================================== */

.audio-info {
    flex: 1;
    min-width: 0;

    margin-left: 20px;

    line-height: normal;
}


/* =====================================================
   TIEMPO
===================================================== */

.audio-time {
    font-size: 14px;

    color: #444444;

    margin-bottom: 7px;

    line-height: 1;
}


/* =====================================================
   BARRA
===================================================== */

.progress-container {
    position: relative;

    width: 100%;

    height: 10px;

    background: #dedede;

    border-radius: 20px;

    overflow: visible;

    cursor: pointer;
}


/* Barra verde */

.progress-bar {
    position: absolute;

    left: 0;
    top: 0;

    width: 0%;

    height: 100%;

    background: #5b951e;

    border-radius: 20px;

    transition:
        width 0.08s linear;
}


/* Punto */

.progress-knob {
    position: absolute;

    left: 0%;
    top: 50%;

    width: 18px;
    height: 18px;

    border-radius: 50%;

    background: #5b951e;

    transform:
        translate(-50%, -50%);

    box-shadow:
        0 3px 6px rgba(0,0,0,0.25),
        inset 0 1px 2px rgba(255,255,255,0.75);

    pointer-events: none;
}


/* =====================================================
   VOLUMEN
===================================================== */

.volume {
    margin-left: 18px;

    font-size: 22px;

    line-height: 1;

    user-select: none;
}


/* =====================================================
   AUDIO
===================================================== */

#audio {
    display: none;
}


/* =====================================================
   CELULAR
===================================================== */

@media (max-width: 700px) {

    .audio-overlay {

        left: 5%;
        width: 90%;

        bottom: 0%;

        height: 13%;

        min-height: 70px;

        padding: 8px 10px;

        border-radius: 18px 18px 0 0;
    }

    .play-btn {

        width: 52px;
        height: 52px;

        min-width: 52px;

        font-size: 22px;

        box-shadow:
            0 4px 0 #3f6f16,
            0 7px 12px rgba(0,0,0,0.20);
    }

    .audio-info {
        margin-left: 12px;
    }

    .audio-time {
        font-size: 11px;
        margin-bottom: 5px;
    }

    .progress-container {
        height: 7px;
    }

    .progress-knob {
        width: 13px;
        height: 13px;
    }

    .volume {
        font-size: 17px;
        margin-left: 8px;
    }
}


/* =====================================================
   CELULARES PEQUEÑOS
===================================================== */

@media (max-width: 420px) {

    .audio-overlay {

        left: 4%;
        width: 92%;

        bottom: 0%;

        min-height: 62px;

        padding: 6px 8px;
    }

    .play-btn {

        width: 46px;
        height: 46px;

        min-width: 46px;

        font-size: 19px;
    }

    .audio-info {
        margin-left: 9px;
    }

    .audio-time {
        font-size: 10px;
    }

    .volume {
        font-size: 15px;
        margin-left: 5px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     PIEZA
===================================================== -->

<div class="pieza-container">

    <img
        src="Final_mercados.png"
        alt="Mercados Solidarios"
        class="pieza"
    >


    <!-- =================================================
         REPRODUCTOR
    ================================================= -->

    <div class="audio-overlay">

        <button
            id="playBtn"
            class="play-btn"
            type="button"
            aria-label="Reproducir audio"
        >
            ▶
        </button>


        <div class="audio-info">

            <div class="audio-time">

                <span id="currentTime">
                    00:00
                </span>

                <span> / </span>

                <span id="duration">
                    00:00
                </span>

            </div>


            <div
                id="progressContainer"
                class="progress-container"
            >

                <div
                    id="progressBar"
                    class="progress-bar"
                ></div>


                <div
                    id="progressKnob"
                    class="progress-knob"
                ></div>

            </div>

        </div>


        <div class="volume">
            🔊
        </div>

    </div>

</div>


<!-- =====================================================
     AUDIO
===================================================== -->

<audio
    id="audio"
    preload="metadata"
>

    <source
        src="Mercados_Solidarios.mp3"
        type="audio/mpeg"
    >

</audio>


<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const audio =
    document.getElementById("audio");

const playBtn =
    document.getElementById("playBtn");

const progressContainer =
    document.getElementById("progressContainer");

const progressBar =
    document.getElementById("progressBar");

const progressKnob =
    document.getElementById("progressKnob");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");


/* =====================================================
   FORMATO DEL TIEMPO
===================================================== */

function formatTime(seconds) {

    if (
        !isFinite(seconds) ||
        seconds < 0
    ) {
        return "00:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60);

    return (
        String(minutes).padStart(2, "0")
        +
        ":"
        +
        String(secs).padStart(2, "0")
    );
}


/* =====================================================
   DURACIÓN
===================================================== */

audio.addEventListener(
    "loadedmetadata",
    function() {

        duration.textContent =
            formatTime(audio.duration);

    }
);


/* =====================================================
   PLAY / PAUSA
===================================================== */

playBtn.addEventListener(
    "click",
    function() {

        if (audio.paused) {

            audio.play();

        } else {

            audio.pause();

        }

    }
);


/* =====================================================
   REPRODUCIENDO
===================================================== */

audio.addEventListener(
    "play",
    function() {

        playBtn.innerHTML = "❚❚";

        playBtn.classList.add("playing");

    }
);


/* =====================================================
   PAUSADO
===================================================== */

audio.addEventListener(
    "pause",
    function() {

        playBtn.innerHTML = "▶";

        playBtn.classList.remove("playing");

    }
);


/* =====================================================
   ACTUALIZAR BARRA Y TIEMPO
===================================================== */

audio.addEventListener(
    "timeupdate",
    function() {

        if (
            !isFinite(audio.duration) ||
            audio.duration <= 0
        ) {
            return;
        }

        const percentage =
            (
                audio.currentTime /
                audio.duration
            ) * 100;


        progressBar.style.width =
            percentage + "%";


        progressKnob.style.left =
            percentage + "%";


        currentTime.textContent =
            formatTime(audio.currentTime);

    }
);


/* =====================================================
   CLIC EN LA BARRA
===================================================== */

progressContainer.addEventListener(
    "click",
    function(event) {

        if (
            !isFinite(audio.duration)
        ) {
            return;
        }

        const rect =
            progressContainer
                .getBoundingClientRect();


        const position =
            event.clientX -
            rect.left;


        let percentage =
            position /
            rect.width;


        percentage =
            Math.max(
                0,
                Math.min(
                    1,
                    percentage
                )
            );


        audio.currentTime =
            percentage *
            audio.duration;

    }
);


/* =====================================================
   FINAL DEL AUDIO
===================================================== */

audio.addEventListener(
    "ended",
    function() {

        playBtn.innerHTML = "▶";

        playBtn.classList.remove("playing");

        progressBar.style.width = "0%";

        progressKnob.style.left = "0%";

        currentTime.textContent = "00:00";

    }
);


/* =====================================================
   DURACIÓN ACTUALIZADA
===================================================== */

audio.addEventListener(
    "durationchange",
    function() {

        if (
            isFinite(audio.duration)
        ) {

            duration.textContent =
                formatTime(audio.duration);

        }

    }
);

</script>

</body>
</html>
